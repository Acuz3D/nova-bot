# Zips the app and attaches Nova-Bot-<version>.zip to a GitHub release.
# Runs when a version tag is pushed (git tag v1.2.3; git push --tags).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip and upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          zip="Nova-Bot-${tag#v}.zip"
          git archive --format=zip --prefix=Nova-Bot/ -o "$zip" HEAD
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --title "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
